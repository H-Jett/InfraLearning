name: 构建书架并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新的 push 会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # 锁版本：mkdocs-material 9.7.5 起把 mkdocs 钉在 <2（MkDocs 2.0 与 Material 不兼容），
        # 不锁的话上游发新版可能让构建某天突然红。
        run: pip install -r requirements.txt

      - name: 校验图标齐备（图标在本地生成并提交，CI 不重新生成）
        run: python scripts/make_icons.py --check

      # 各本书自己的校验由 build_site.py 按 books.yml 逐本调用，
      # 任何一本失败都会让整个构建失败——保证站点永远不会发布半成品。
      - name: 构建全部书 + 索引页
        run: python scripts/build_site.py

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
