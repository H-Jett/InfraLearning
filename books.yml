# 这个仓库有哪些书 —— 单一真源。
#
# 加一本书 = 建 books/<slug>/ 目录 + 在下面加一条记录。
# 构建脚本据此决定「构建哪些书」和「索引页列哪些书」，
# 不会出现「书加了但索引忘了改」。

# 站点根地址。**仓库改名时只改这一行**，各书的 site_url 由它拼出。
base_url: https://h-jett.github.io/AGILearning/
repo_url: https://github.com/H-Jett/AGILearning

# PWA（手机「添加到主屏幕」后的表现）
app_name: AGI
app_short_name: AGI
app_theme_color: "#2C2C2A"        # 书架首页的地址栏配色（各书用自己的，见下）
app_background_color: "#FBFBFA"

site_title: AGI
site_tagline: 一个方向一个仓库 · Infra、多模态、强化学习，通往 AGI 的技术栈
site_description: >-
  面向算法工程师的技术书：每本自成体系、独立成站。概念 → 思考题 → 真机代码练习，
  力求正确，结论尽量在真机上跑出数据、并给出一手出处。

books:
  - slug: infra
    dir: books/infra
    title: 算法工程师的 Infra 入门
    subtitle: 从推理到 GPU 算子、分布式训练
    description: 推理→算子→框架→分布式训练，每章配 RTX 5090 真机实验，力求正确。
    status: 进行中
    progress: 第二部分 · 已完成到第 12 章（性能分析）
    palette:                       # 这本书的专属配色（不与其他书重复，见构建脚本的查重）
      primary: "#0E7490"           # 青蓝：页头 / 主色
      accent: "#2AA0BF"            # 链接 hover / 强调
    checks:                        # 这本书自己的校验命令（在书目录下执行，照搬其原 CI）
      - python scripts/sync_code.py --check

  - slug: multimodal
    dir: books/multimodal
    title: 多模态入门：给 LLM 工程师的一本书
    subtitle: 从纯文本 LLM 出发，讲清多模态
    description: 面向熟悉纯文本 LLM、零多模态基础的工程师；处处从文本世界做类比再讲差异，配 RTX 5090 真机实验。
    status: 进行中
    progress: 第一部分 · 已完成到第 3 章（CLIP）+ 实战项目 1
    palette:                       # 赤橙，与 infra 的青蓝感知距离 ≥ 120
      primary: "#B5541F"           # 赤橙：页头 / 主色
      accent: "#D2743C"            # 链接 hover / 强调
    checks:
      - python scripts/sync_code.py --check

  - slug: rl
    dir: books/rl
    title: 强化学习：从基础到 LLM 后训练
    subtitle: 从 MDP、策略梯度到 RLHF/GRPO
    description: 面向懂深度学习与 LLM、但没系统学过 RL 的工程师；从最小 RL 骨架讲到今天 LLM 后训练在用的方法。
    status: 初始化
    progress: 骨架与七部分路线图已就位，正文待写
    palette:                       # 紫罗兰，与 infra 青蓝(185)、mm 赤橙(257)均 ≥ 120
      primary: "#6D3FB0"           # 紫罗兰：页头 / 主色
      accent: "#8A5CD0"            # 链接 hover / 强调
    checks:
      - python scripts/sync_code.py --check
