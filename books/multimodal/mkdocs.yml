site_name: 多模态入门：给 LLM 工程师的一本书
site_description: 从纯文本 LLM 出发、边学边记、力求正确的多模态入门书
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入

# 仓库链接：右上角显示 GitHub 图标 + 每页右上"编辑此页"
repo_url: https://github.com/H-Jett/InfraLearning
repo_name: H-Jett/InfraLearning
edit_uri: edit/main/books/multimodal/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - content.action.edit   # 每页"在 GitHub 上编辑"
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy     # 代码块一键复制

# 书内容放在 docs/（MkDocs 默认文档目录）。GitHub 上照样能浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。exercises/ 里的可运行代码留在仓库根，通过
# scripts/sync_code.py 内联进章节，所以任何 Markdown 阅读器都能直接看到代码。

# 只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown 扩展。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 术语表: glossary.md
  - 第一部分 · 视觉表征基础:
      - chapters/01-vision-basics/00-intro.md
      - 第 1 章 · 图像如何变成 token: chapters/01-vision-basics/01-image-to-tokens.md
      - 第 2 章 · ViT：把 Transformer 用到图像上: chapters/01-vision-basics/02-vit.md
      - 第 3 章 · CLIP：对比学习怎么把图文对齐: chapters/01-vision-basics/03-clip.md
      - 🛠 实战项目 1 · 图像 token 预算计算器: chapters/01-vision-basics/P1-token-budget.md
  - 思考题参考答案:
      - 第 1 章: qa/01-image-to-tokens-qa.md
      - 第 2 章: qa/02-vit-qa.md
      - 第 3 章: qa/03-clip-qa.md

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
