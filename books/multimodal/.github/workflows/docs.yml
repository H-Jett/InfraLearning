name: 构建并发布文档到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布，新的 push 会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install mkdocs-material

      - name: 校验代码附录已与源码同步
        run: python scripts/sync_code.py --check

      - name: 构建站点
        run: mkdocs build --strict   # --strict：有坏链接/警告直接失败

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
