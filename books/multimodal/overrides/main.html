{% extends "base.html" %}
<!-- 由 scripts/build_site.py 依据 books.yml 生成，请勿手改 -->

{% block extrahead %}
  <link rel="manifest" href="/AGILearning/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/AGILearning/icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="多模态入门：给 LLM 工程师的一本书">
  <script>
    // 这本书的地址栏配色。Material 也会输出一条 theme-color，
    // 这里统一成本书的颜色，避免两条并存导致表现不一致。
    (function () {
      function setThemeColor() {
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.parentNode.removeChild(m);
        });
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = '#B5541F';
        document.head.appendChild(m);
      }
      setThemeColor();
      document.addEventListener('DOMContentLoaded', setThemeColor);
      // 在页头右侧塞一个「返回书架」链接：复用已有页头栏，不额外占高度。
      // 用 MutationObserver 兜底，保证 navigation.instant 切页后依然在。
      function addShelfBack() {
        var inner = document.querySelector('.md-header__inner');
        if (!inner || inner.querySelector('a.shelf-back')) return;
        var a = document.createElement('a');
        a.className = 'shelf-back md-header__button';
        a.href = '/AGILearning/';
        a.title = '返回书架 · 全部书目';
        a.innerHTML = '<span class="shelf-back__icon">\uD83D\uDCDA</span>' +
                      '<span class="shelf-back__text">书架</span>';
        inner.appendChild(a);
      }
      addShelfBack();
      document.addEventListener('DOMContentLoaded', addShelfBack);
      new MutationObserver(addShelfBack).observe(document.documentElement,
        { childList: true, subtree: true });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/AGILearning/sw.js', { scope: '/AGILearning/' });
        });
      }
    })();
  </script>
{% endblock %}
