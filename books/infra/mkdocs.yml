site_name: 算法工程师的 Infra 入门
site_description: 一本边学边记、力求正确的 infra 入门书
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/AGILearning
repo_name: H-Jett/AGILearning
edit_uri: edit/main/books/infra/docs/
theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy     # 代码块一键复制

# 书内容放在 docs/（MkDocs 默认文档目录）。GitHub 上照样能浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。exercises/ 里的可运行代码留在仓库根，通过
# scripts/sync_code.py 内联进章节，所以任何 Markdown 阅读器都能直接看到代码。

# 只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown 扩展。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 术语表: glossary.md
  - 第一部分 · 推理与服务:
      - chapters/01-inference/00-intro.md
      - 第 1 章 · Prefill 与 Decode:
          - chapters/01-inference/01-prefill-decode.md
          - 补充 A · GPU 存储层级与 HBM: chapters/01-inference/A1-gpu-storage-hbm.md
          - 补充 B · CUDA 异步/同步与基准测试: chapters/01-inference/A2-cuda-async-sync-benchmark.md
      - 第 2 章 · KV Cache: chapters/01-inference/02-kv-cache.md
      - 第 3 章 · Batching: chapters/01-inference/03-batching.md
      - 第 4 章 · PagedAttention: chapters/01-inference/04-paged-attention.md
      - 第 5 章 · 前缀复用: chapters/01-inference/05-prefix-caching.md
      - 第 6 章 · 量化: chapters/01-inference/06-quantization.md
      - 第 7 章 · 投机解码: chapters/01-inference/07-speculative-decoding.md
      - 第 8 章 · 服务指标与压测: chapters/01-inference/08-serving-metrics.md
      - 第 9 章 · 推理引擎全景: chapters/01-inference/09-engines.md
      - 第一部分小结（速查）: chapters/01-inference/summary.md
  - 第二部分 · GPU 架构与算子优化:
      - chapters/02-gpu-kernels/00-intro.md
      - 第 10 章 · GPU 架构深入: chapters/02-gpu-kernels/10-gpu-arch.md
      - 第 11 章 · CUDA 编程模型: chapters/02-gpu-kernels/11-cuda-model.md
      - 第 12 章 · 性能分析: chapters/02-gpu-kernels/12-profiling.md
  - 思考题参考答案:
      - 第 1 章: qa/01-prefill-decode-qa.md
      - 第 2 章: qa/02-kv-cache-qa.md
      - 第 3 章: qa/03-batching-qa.md
      - 第 4 章: qa/04-paged-attention-qa.md
      - 第 5 章: qa/05-prefix-caching-qa.md
      - 第 6 章: qa/06-quantization-qa.md
      - 第 7 章: qa/07-speculative-decoding-qa.md
      - 第 8 章: qa/08-serving-metrics-qa.md
      - 第 9 章: qa/09-engines-qa.md
      - 第 10 章: qa/10-gpu-arch-qa.md
      - 第 11 章: qa/11-cuda-model-qa.md
      - 第 12 章: qa/12-profiling-qa.md

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
